name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-tests.txt
      - run: python -m pytest tests/unit -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --log-opts=HEAD --no-banner -v

  build-images:
    needs: [unit-tests, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        run: |
          docker build \
            --build-arg APP_REVISION="$GITHUB_SHA" \
            -t ghcr.io/kwxkdx/conduit-api:$GITHUB_SHA \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/kwxkdx/conduit-web:$GITHUB_SHA \
            ./frontend

      - name: Push images to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/kwxkdx/conduit-api:$GITHUB_SHA
          docker push ghcr.io/kwxkdx/conduit-web:$GITHUB_SHA

  deploy:
    if: ${{ false }}
    needs: [unit-tests, secret-scan, build-images]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy is temporarily paused"
